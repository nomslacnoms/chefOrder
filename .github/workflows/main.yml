name: Build ChefOrder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get ChefOrder code
        uses: actions/checkout@v4

      - name: Create Gradle project files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ChefOrder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CHEFORDER_KEYSTORE_BASE64 }}
        run: |
          sed '1d;$d' <<< "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chefOrder-release.jks"
          chmod 600 "$RUNNER_TEMP/chefOrder-release.jks"

      - name: Build release APK
        env:
          CHEFORDER_KEYSTORE_FILE: ${{ runner.temp }}/chefOrder-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload ChefOrder APK
        uses: actions/upload-artifact@v4
        with:
          name: ChefOrder-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
